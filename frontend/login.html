<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — NexusPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  </head>
  <body data-page="login">
    <div id="navbar-root"></div>

    <main class="page-pad">
      <div class="container container--narrow">
        <div class="auth-card">
          <h1 class="page-title">Welcome Back</h1>
          <p class="page-sub">Log in to track orders and check out faster.</p>

          <form id="auth-form" class="auth-form">
            <label>Email
              <input name="email" type="email" required placeholder="you@example.com" />
            </label>
            <label>Password
              <input name="password" type="password" required placeholder="••••••••" />
            </label>
            <div class="form-error" id="auth-error" hidden></div>
            <button type="submit" class="btn btn--dark btn--lg btn--block" id="auth-submit">Log In</button>
          </form>

          <div class="auth-divider"><span>or</span></div>
          <div id="google-signin-button" class="google-signin-button" aria-label="Sign in with Google"></div>
          <div class="form-error" id="google-signin-error" hidden></div>

          <form id="google-link-form" class="auth-form auth-form--link" hidden>
            <p class="auth-form-note">
              This email already has a NexusPlay account. Enter your password to connect Google Sign-In.
            </p>
            <label>Existing account password
              <input id="google-link-password" name="password" type="password" required placeholder="••••••••" />
            </label>
            <div class="form-error" id="google-link-error" hidden></div>
            <button type="submit" class="btn btn--dark btn--lg btn--block" id="google-link-submit">
              Connect Google account
            </button>
          </form>

          <p class="auth-alt">New to NexusPlay? <a href="/register.html">Create an account</a></p>
        </div>
      </div>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
