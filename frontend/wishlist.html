<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist — NexusPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  </head>
  <body data-page="wishlist">
    <div id="navbar-root"></div>

    <main class="page-pad" id="wishlist-root">
      <div class="container">
        <div class="wishlist-head">
          <h1 class="page-title">My Wishlist</h1>
          <span class="wishlist-head__count"><span class="wishlist-count">0</span> saved</span>
        </div>

        <div class="wishlist-layout">
          <!-- renderWishlist() in pages/product.ts fills these -->
          <div class="wishlist-list" aria-live="polite"></div>
          <aside class="wishlist-summary"></aside>
        </div>
      </div>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
