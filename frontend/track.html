<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track Order — NexusPlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  </head>
  <body data-page="track">
    <div id="navbar-root"></div>

    <main class="page-pad">
      <div class="container container--narrow">
        <h1 class="page-title">Track Your Order</h1>
        <p class="page-sub">Enter your order number and the phone number you ordered with.</p>

        <form id="track-form" class="track-form">
          <label>Order Number
            <input id="track-no" type="text" required placeholder="NP2611171234" />
          </label>
          <label>Phone Number
            <input id="track-phone" type="tel" required placeholder="01XXXXXXXXX" />
          </label>
          <button type="submit" class="btn btn--dark btn--lg">Track Order</button>
        </form>

        <div id="track-result"></div>
      </div>
    </main>

    <div id="footer-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
