name: Commerce build checks
on:
  push:
    branches:
      - 'fix/phase-0b-commerce'
      - 'feature/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: test -f dist/orders.html
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/NexusPlay.Api/NexusPlay.Api.csproj
      - run: dotnet build backend/NexusPlay.Api/NexusPlay.Api.csproj --configuration Release --no-restore
