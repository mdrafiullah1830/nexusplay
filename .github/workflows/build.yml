name: Build NexusPlay

on:
  push:
    branches:
      - main
      - fix/backend-production-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Build .NET 10 API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/NexusPlay.Api/NexusPlay.Api.csproj

      - name: Build
        run: dotnet build backend/NexusPlay.Api/NexusPlay.Api.csproj --configuration Release --no-restore

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build